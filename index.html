```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes | Your Personal Notes</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>QuickNotes</h1>
        <p>Your thoughts, organised in one place.</p>
    </header>

    <main>
        <section id="add-note-section">
            <h2>Add a Note</h2>

            <form id="note-form">
                <div class="form-group">
                    <label for="note-input">Your note</label>
                    <input
                        type="text"
                        id="note-input"
                        placeholder="What would you like to remember?"
                        maxlength="200"
                    >
                </div>

                <div class="form-group">
                    <label for="note-category">Choose a category</label>
                    <select id="note-category">
                        <option value="personal">Personal</option>
                        <option value="work">Work</option>
                        <option value="study">Study</option>
                    </select>
                </div>

                <button type="submit">Add Note</button>
            </form>

            <p id="error-message" role="alert"></p>
        </section>

        <section id="your-notes-section">
            <h2>Your Notes</h2>

            <div class="search-group">
                <label for="search-input">Search your notes</label>
                <input
                    type="search"
                    id="search-input"
                    placeholder="Type to search..."
                >
            </div>

            <p id="note-count">You have no notes yet.</p>

            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 QuickNotes. Keep your thoughts organised.</p>
    </footer>

</body>
</html>
```
